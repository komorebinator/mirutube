# MiruTube's next version, on a computer that tries it: put this file in
# ~/.config/containers/systemd/mirutube.container.d/ beside mirutube.container.
# It runs the image built from every push to main, before a release names it,
# and podman auto-update follows it there.
[Container]
Image=ghcr.io/komorebinator/mirutube:experimental
