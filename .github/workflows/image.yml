# image_build: every push to main that changes what the image is built from
# builds it as `experimental`, labelled with the commit, for the computers
# that try the next version and for check_image. Releases do not build: they
# promote this image (release.yml), so what people receive is what was checked.
name: image

on:
  push:
    branches: [main]
    paths:
      - "mirutube/**"
      - Containerfile
      - "image/**"
      - .containerignore
      - .github/workflows/image.yml

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: podman build --build-arg REVISION=${{ github.sha }} -t "$IMAGE:experimental" .
      - name: Push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman push "$IMAGE:experimental"
