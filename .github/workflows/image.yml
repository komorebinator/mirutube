# image_build: the image every installed MiruTube runs. Every push to
# experimental is built as `experimental`, for a computer trying the next
# version; a published release as its version and `latest`, with the files
# MiruTube is installed from attached to it.
name: image

on:
  push:
    branches: [experimental]
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Tags
        id: tags
        run: |
          if [ "${{ github.event_name }}" = release ]; then
            echo "list=${{ github.event.release.tag_name }} latest" >> "$GITHUB_OUTPUT"
          else
            echo "list=experimental" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        run: podman build $(printf -- '-t %s:%s ' "$IMAGE" ${{ steps.tags.outputs.list }}) .
      - name: Push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in ${{ steps.tags.outputs.list }}; do podman push "$IMAGE:$tag"; done
      - name: Attach the files MiruTube is installed from
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" mirutube.container nvidia.conf experimental.conf --clobber
