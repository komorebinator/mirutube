description: How work is done on MiruTube. The maintainer works on `experimental`, runs the server from the working tree against a real library and looks at it in a browser, and brings what was tried to `main` by pull request; a GitHub Release names a version of `main`, and publishing it builds the image every installed MiruTube updates itself to.
extends: "@DuckWorkflow"
main_branch: main
versioning:
  type: "@SemVer"
release_notes: "@GitHub#read_release"
guidelines:
  - "Never merge into `main` to find out whether something works. `main` is what the next release, and so every installed MiruTube, is made from, so a change is tried in the working tree first: the tests pass, and the author has looked at it in a browser against a real library — nothing else here can say a page looks right or a video plays."
branches:
  - id: main
    description: What releases are made from. Changes reach it only by a merged pull request from `experimental`.
  - id: experimental
    description: Where the work is committed and pushed. Pushing here keeps the work off one machine and builds the `experimental` image (experimental_image), which only a computer that chose to try the next version runs; it delivers nothing to anyone else.
channels:
  - id: releases
    from: main
    description: GitHub Releases, one per version, each with its release notes — the record of what changed — and with `mirutube.container`, `nvidia.conf` and `experimental.conf` attached, the files MiruTube is installed from.
  - id: image
    from: releases
    description: "`ghcr.io/komorebinator/mirutube`, the image every installed MiruTube runs, built by image_build when a release is published and tagged with its version and `latest`; `podman auto-update` on each computer follows `latest`."
  - id: experimental_image
    from: experimental
    description: "`ghcr.io/komorebinator/mirutube:experimental`, built by image_build on every push to `experimental`: what a computer trying the next version runs, installed the same way with the drop-in `experimental.conf` beside the unit, so the way MiruTube reaches people — the build, the registry, the update — is what gets tried, not a copy carried over by hand."
steps:
  - id: requested
    description: A change is wanted — an open issue, read with @GitHub#read_issue, or a request in the conversation. It is clarified, then written into the terms.
    when: a request exists that the project's terms do not yet reflect
  - id: specified
    description: The change is in the spec, which is consistent, but the sources do not implement it yet.
    when: the change is present in the terms, verify_project is clean, and the sources do not yet implement it
    operation: "@Software#build"
  - id: implemented
    description: The working tree carries the change and the project validates, tests included, but the author has not looked at it running. The server is started from the working tree against the author's library.
    when: the working tree carries the change, @DuckspecProject#validate passes, and no server started after the change was last edited is running
    operation: "@Software#run"
  - id: testing_locally
    description: The server runs the change, and the author looks at it in a browser — the behaviour asked for, and nothing around it broken. Only the author can say it is right.
    when: a server started after the change was last edited is running, and the author has not yet said it works
    operation: "@Git#commit"
  - id: committed
    description: The change is recorded locally and has reached no one.
    when: local commits carry the change and are not on the remote
    operation: "@Git#push(branch=experimental)"
  - id: on_experimental
    description: The change is on `experimental`, and in the `experimental` image a test computer updates itself to; more changes may join it there, and it goes to `main` when the author says it should.
    when: experimental carries the change, main does not, and no pull request into main carries it
    operation: "@GitHub#open_pull_request(head=experimental, base=main)"
  - id: in_review
    description: A pull request from `experimental` to `main` carries the change; merging it is what delivers it.
    when: an open pull request into main carries the change
    operation: "@GitHub#merge_pull_request(strategy=merge)"
  - id: on_main
    description: The change is on `main`, but no version names it yet, so no installed MiruTube has it.
    when: main carries the change and its `version` is still the one the latest release tag names
    operation: "@DuckspecProject#prepare_release"
  - id: versioned
    description: A version covering the change is prepared, and its bump has itself travelled the steps above to `main`.
    when: main carries a `version` that no tag names yet
    operation: "@GitHub#create_release"
  - id: released
    description: The change is named by a published version, with release notes saying what changed.
    when: a GitHub Release exists for a version whose tag contains the change
components:
  - id: image_build
    type: GitHub Actions workflow
    src: .github/workflows/image.yml
    description: "Builds the image from the source and pushes it to `ghcr.io/komorebinator/mirutube`: on every push to `experimental` as `experimental`; on a published release as the release's version and as `latest`, attaching `mirutube.container`, `nvidia.conf` and `experimental.conf` to the release."
